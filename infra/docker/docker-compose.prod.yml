name: mahjong-prod

services:
  db:
    image: postgres:17
    restart: always
    env_file:
      - ../../.env.prod
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.backend
    restart: always
    env_file:
      - ../../.env.prod
    depends_on:
      db:
        condition: service_healthy

  nginx:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
